services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsr}
      POSTGRES_USER: ${POSTGRES_USER:-dsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment: &app-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-dsr}
      POSTGRES_USER: ${POSTGRES_USER:-dsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsr}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 60"
    ports:
      - "8002:8002"
    # Ready = migrations done and the database and queue reachable. Kept
    # infrequent: each check starts a Python process, which is not free on a
    # small Docker VM.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    environment: *app-env
    command: celery -A config.celery:app worker --loglevel=INFO
    # No health check: `celery inspect ping` starts a whole Celery process
    # each time, which starved a 2-CPU Docker VM. Stuck work is caught by the
    # every-minute dispatcher and shows on the DPO Integrations page.
    depends_on:
      web:
        condition: service_healthy

  beat:
    build: .
    environment: *app-env
    command: celery -A config.celery:app beat --loglevel=INFO
    depends_on:
      web:
        condition: service_healthy

  frontend:
    container_name: dsrprototype-frontend-ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DSR_API_URL: http://web:8002
      MOCK_SESSION_SECRET: ${NEXT_MOCK_SESSION_SECRET:-local-ui-demo-session-secret}
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --hostname 0.0.0.0 --port 3002
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next: