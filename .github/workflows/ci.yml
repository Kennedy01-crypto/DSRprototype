name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dsr
          POSTGRES_USER: dsr
          POSTGRES_PASSWORD: dsr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsr -d dsr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_HOST: localhost
      POSTGRES_DB: dsr
      POSTGRES_USER: dsr
      POSTGRES_PASSWORD: dsr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test dsr

  frontend:
    name: Frontend type-check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  e2e:
    name: Browser tests (full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (production frontend build)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 900
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Wait for the frontend
        run: |
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:3002/login && exit 0
            sleep 5
          done
          exit 1
      - name: Run browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
